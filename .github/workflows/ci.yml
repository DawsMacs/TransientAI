name: CI
on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repository or to see a secret.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A platform that fails is a finding, not a reason to stop the others.
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-glibc   # the reference
            os: ubuntu-24.04
          - name: linux-aarch64-glibc
            os: ubuntu-24.04-arm
          - name: linux-x86_64-musl    # same CPU, different C library
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: macos-arm64
            os: macos-15
          # Intel macOS: Rust tier 2 (demoted from tier 1). GitHub plans to stop offering Intel macOS runners once the macOS 15 image
          # retires (around fall 2027, not confirmed to the day), so this row is temporary; keep it while the label exists.
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-2022
    env:
      TARGET_FLAG: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
    defaults:
      run:
        shell: bash
    steps:
      # Third-party actions are pinned by commit, with the tag or branch noted beside each.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Platform and toolchain (recorded, so a difference can be traced)
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            rustc -Vv
            cargo -V
            uname -a || true
            echo "powercap: $(ls /sys/class/powercap 2>&1 | head -3 | tr '\n' ' ')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build (no dependencies, no network needed)
        run: cargo build --release --offline $TARGET_FLAG

      - name: Tests (includes the must-refuse batteries)
        run: cargo test --release --offline $TARGET_FLAG

      - name: Scorecard must report 0.0% wrong
        run: |
          cargo run --release --offline $TARGET_FLAG --bin baby -- school | tee school.out
          rows=$(grep -E '^ +(taught|reworded|never taught|beyond the taught range) ' school.out)
          test "$(echo "$rows" | wc -l)" -eq 4
          if echo "$rows" | grep -vE ' 0\.0% *$'; then echo "WRONG column above 0.0%"; exit 1; fi

      # Differences from the reference are reported, never absorbed: this step warns and does not fail.
      - name: Math fingerprint (compared with the Linux x86_64 reference)
        run: |
          cargo run --release --offline $TARGET_FLAG --example mathprint > mathprint.out
          echo "::group::mathprint output"; cat mathprint.out; echo "::endgroup::"
          grep -v '^#' mathprint.out | tr -d '\r' > got.txt
          grep -v '^#' baby/examples/mathprint.expected | tr -d '\r' > want.txt
          reference=$(grep '^# reference' baby/examples/mathprint.expected | cut -c3-)
          if diff -u want.txt got.txt > mathprint.diff; then
            echo "Math fingerprint on ${{ matrix.name }}: identical to the $reference, on every input tested." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Math fingerprint on ${{ matrix.name }}: **differs** from the $reference. First differing lines:"
              echo '```'
              head -40 mathprint.diff
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Math fingerprint differs on ${{ matrix.name }}::see the job summary"
          fi

      # Reported only: how far this platform's results are from the correctly rounded ones. Never fails the job.
      - name: Math accuracy audit (reported)
        run: |
          cargo run --release --offline $TARGET_FLAG --example mathprint -- audit | tee audit.out
          {
            echo "Math accuracy audit on ${{ matrix.name }}:"
            echo '```'
            tr -d '\r' < audit.out | grep -v '^#'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Reported, not failing: a golden that differs is a finding (a platform difference, or goldens that need updating on
      # purpose). Three runs per row must first agree with each other, or the comparison would prove nothing.
      - name: Golden outputs (compared with the Linux x86_64 reference)
        timeout-minutes: 25
        run: |
          set +e
          bash golden/check.sh 2>&1 | tee golden.out
          code=${PIPESTATUS[0]}
          {
            echo "Golden outputs on ${{ matrix.name }}:"
            echo '```'
            tr -d '\r' < golden.out | grep -E '^(golden|NOT REPRODUCIBLE|the [0-9]+ runs|could not)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case $code in
            0) ;;
            1) echo "::warning title=Goldens differ on ${{ matrix.name }}::see the job summary" ;;
            3) echo "::warning title=Runs disagree on ${{ matrix.name }}::see the job summary" ;;
            *) echo "::error::the golden check could not run (status $code)"; exit 1 ;;
          esac

  # The BSDs, in virtual machines on a Linux runner (cross-platform-actions). Rust's own support: FreeBSD and NetBSD tier 2 with host tools,
  # OpenBSD tier 3 (so the distribution's Rust package, whatever version it ships). DragonFly was tried and dropped on 2026-10-24: its packaged
  # Rust (1.85.1) crashes the binary at startup inside the standard library's thread-local code ("assertion failed: key as usize != KEY_SENTVAL"),
  # before any Transient logic runs; the tests themselves passed there. Every step runs INSIDE the VM through the
  # cpa.sh shell. Reported like the other non-reference rows: the tests, the scorecard WRONG gate and the build can fail the job (a real
  # finding); the fingerprint and the golden check only report. The package names below are the first attempt, not verified.
  bsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: freebsd-x86_64
            os: freebsd
            version: '15.1'
            install: sudo pkg install -y rust
          - name: netbsd-x86_64
            os: netbsd
            version: '10.1'
            install: sudo pkgin -y install rust
          - name: openbsd-x86_64
            os: openbsd
            version: '7.9'
            install: (command -v doas >/dev/null && doas pkg_add rust) || sudo pkg_add rust
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the ${{ matrix.name }} VM
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: x86-64
          shell: bash
          memory: 6G
          cpu_count: 4
          sync_files: runner-to-vm

      - name: Toolchain
        run: |
          uname -a
          ${{ matrix.install }}
          rustc -Vv
          cargo -V

      - name: Build and tests
        run: |
          cargo build --release --offline
          cargo test --release --offline

      - name: Scorecard must report 0.0% wrong
        run: |
          ./target/release/baby school | tee school.out
          rows=$(grep -E '^ +(taught|reworded|never taught|beyond the taught range) ' school.out)
          test "$(echo "$rows" | wc -l)" -eq 4
          if echo "$rows" | grep -vE ' 0\.0% *$'; then echo "WRONG column above 0.0%"; exit 1; fi

      - name: Math fingerprint (reported)
        run: |
          cargo run --release --offline --example mathprint > mathprint.out
          grep -v '^#' mathprint.out | tr -d '\r' > got.txt
          grep -v '^#' baby/examples/mathprint.expected | tr -d '\r' > want.txt
          echo "--- this platform's fingerprint (section hashes and the folded-constant lines):"
          grep -E '^(fp|const) ' mathprint.out
          if diff -u want.txt got.txt > mathprint.diff; then echo "Math fingerprint on ${{ matrix.name }}: identical to the Linux x86_64 reference."; else echo "Math fingerprint on ${{ matrix.name }}: DIFFERS from the reference (first lines follow)"; head -30 mathprint.diff; fi

      - name: Golden outputs (reported)
        run: |
          set +e
          bash golden/check.sh 2>&1 | tr -d '\r' | grep -E '^(golden|NOT REPRODUCIBLE|the [0-9]+ runs|could not)'
          echo "golden check status: ${PIPESTATUS[0]}"
          exit 0

      - name: Math accuracy audit (reported)
        run: |
          cargo run --release --offline --example mathprint -- audit | grep -E '^(audit|# audit)' || true

  # WebAssembly (WASI) under Wasmtime: a sandbox with no operating system underneath, and a math library compiled into the program itself (so it should
  # not depend on the host). Wasmtime is downloaded at a fixed version and verified against its published SHA-256 before it is run. Some things cannot run
  # there (starting other programs: `scale --sweep`, `adapt-drive`, the Python pipe test, which skips itself; `std::env::temp_dir()` and
  # `std::process::id()` panic, so tests use `platform::temp_dir()` and `platform::unique_id()` with TMPDIR set). Reported like the other non-reference
  # rows: build, tests and the scorecard WRONG gate can fail the job; the fingerprint, accuracy audit and golden check only report.
  wasi:
    name: wasi-wasm32-wasmtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WASMTIME_VERSION: v50.0.0
      WASMTIME_SHA256: 77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff
      TARGET_FLAG: --target wasm32-wasip1
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir . --dir /tmp --env TMPDIR=/tmp
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Install Wasmtime (fixed version, checksum verified)
        run: |
          mkdir -p "$HOME/wasmtime-dl" && cd "$HOME/wasmtime-dl"
          curl -fsSL -o wasmtime.tar.xz "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          echo "${WASMTIME_SHA256}  wasmtime.tar.xz" | sha256sum -c -
          tar -xJf wasmtime.tar.xz --strip-components=1
          echo "$HOME/wasmtime-dl" >> "$GITHUB_PATH"

      - name: Platform and toolchain (recorded)
        run: |
          rustc -Vv
          wasmtime --version

      - name: Build and tests (under Wasmtime)
        run: |
          cargo build --release --offline $TARGET_FLAG
          cargo test --release --offline $TARGET_FLAG

      - name: Scorecard must report 0.0% wrong
        run: |
          cargo run --release --offline $TARGET_FLAG --bin baby -- school | tee school.out
          rows=$(grep -E '^ +(taught|reworded|never taught|beyond the taught range) ' school.out)
          test "$(echo "$rows" | wc -l)" -eq 4
          if echo "$rows" | grep -vE ' 0\.0% *$'; then echo "WRONG column above 0.0%"; exit 1; fi

      - name: Math fingerprint (reported)
        run: |
          cargo run --release --offline $TARGET_FLAG --example mathprint > mathprint.out
          grep -E '^(fp|const) ' mathprint.out
          grep -v '^#' mathprint.out | tr -d '\r' > got.txt
          grep -v '^#' baby/examples/mathprint.expected | tr -d '\r' > want.txt
          if diff -u want.txt got.txt > mathprint.diff; then echo "Math fingerprint on wasi: identical to the Linux x86_64 reference."; else echo "Math fingerprint on wasi: DIFFERS from the reference (first lines follow)"; head -30 mathprint.diff; fi

      - name: Math accuracy audit (reported)
        run: |
          cargo run --release --offline $TARGET_FLAG --example mathprint -- audit | grep -E '^(audit|# audit)' || true

      - name: Golden outputs (reported)
        run: |
          set +e
          bash golden/check.sh 2>&1 | tr -d '\r' | grep -E '^(golden|NOT REPRODUCIBLE|the [0-9]+ runs|could not)'
          echo "golden check status: ${PIPESTATUS[0]}"
          exit 0
